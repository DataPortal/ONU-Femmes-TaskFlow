<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ONU Femmes — Inscription</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="register">
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="assets/img/logunw.jpg" alt="ONU Femmes" class="logo" />
        <div>
          <h1>ONU Femmes Task Manager</h1>
          <p>Gestion des utilisateurs et des piliers</p>
        </div>
      </div>

      <div class="top-tools no-print">
        <select id="currentUserSelect"></select>
        <div id="currentUserLabel"></div>
        <button id="logoutBtn" class="secondary" type="button">Déconnexion</button>
      </div>
    </div>
  </header>

  <nav class="no-print">
    <a href="index.html">Dashboard</a>
    <a href="mes-taches.html">Mes tâches</a>
    <a href="mon-equipe.html">Mon équipe</a>
    <a href="inscription.html" class="active">Inscription</a>
  </nav>

  <main class="container">

    <div id="pageDebugMessage"></div>

    <!-- ============================= -->
    <!-- CRÉATION PILIER -->
    <!-- ============================= -->
    <section class="card">
      <h2 class="section-title">Créer un pilier</h2>

      <div class="form-group">
        <label for="pillarName">Nom du pilier</label>
        <input id="pillarName" type="text" placeholder="Ex : WPS" />
      </div>

      <div class="form-group">
        <label for="pillarSupervisor">Superviseur</label>
        <select id="pillarSupervisor"></select>
      </div>

      <button id="createPillarBtn">Créer le pilier</button>

      <div id="pillarMessage"></div>
    </section>

    <!-- ============================= -->
    <!-- INSCRIPTION UTILISATEUR -->
    <!-- ============================= -->
    <section class="card" style="margin-top:20px;">
      <h2 class="section-title">Inscrire un membre</h2>

      <div class="form-group">
        <label for="userName">Nom complet</label>
        <input id="userName" type="text" placeholder="Nom et prénom" />
      </div>

      <div class="form-group">
        <label for="userEmail">Email</label>
        <input id="userEmail" type="email" placeholder="email@unwomen.org" />
      </div>

      <div class="form-group">
        <label for="userRole">Rôle</label>
        <select id="userRole">
          <option value="staff">Staff</option>
          <option value="supervisor">Superviseur</option>
        </select>
      </div>

      <div class="form-group">
        <label for="userPillar">Pilier</label>
        <select id="userPillar"></select>
      </div>

      <div class="form-group">
        <label for="userSupervisor">Superviseur</label>
        <select id="userSupervisor"></select>
      </div>

      <button id="createUserBtn">Créer le membre</button>

      <div id="userMessage"></div>
    </section>

    <!-- ============================= -->
    <!-- LISTE DES PILIERS -->
    <!-- ============================= -->
    <section class="card" style="margin-top:20px;">
      <h2 class="section-title">Liste des piliers</h2>

      <div id="pillarsList"></div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="script.js"></script>

</body>
</html>
