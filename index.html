<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONU Femmes — Task Manager</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<img src="assets/img/logo.png" class="logo">

<h1>ONU Femmes Task Manager</h1>

</header>

<section class="dashboard">

<div class="card">
<h3>Total tâches</h3>
<p id="totalTasks">0</p>
</div>

<div class="card">
<h3>En cours</h3>
<p id="inProgress">0</p>
</div>

<div class="card">
<h3>Terminées</h3>
<p id="completed">0</p>
</div>

<div class="card">
<h3>En retard</h3>
<p id="late">0</p>
</div>

</section>

<section class="taskSection">

<h2>Liste des tâches</h2>

<table id="taskTable">

<thead>

<tr>
<th>ID</th>
<th>Tâche</th>
<th>Pilier</th>
<th>Assigné</th>
<th>Priorité</th>
<th>Statut</th>
<th>Progression</th>
<th>Echéance</th>
</tr>

</thead>

<tbody>

</tbody>

</table>

</section>

<script src="script.js"></script>

</body>
</html>
