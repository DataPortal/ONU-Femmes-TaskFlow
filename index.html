<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONU Femmes — Connexion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="assets/img/logunw.jpg" alt="ONU Femmes" class="logo" />
        <div>
          <h1>ONU Femmes Task Manager</h1>
          <p>Connexion sécurisée à la plateforme</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container login-page">
    <section class="login-card">
      <div class="login-card-header">
        <h2 class="section-title">Se connecter</h2>
        <p class="muted">Utilisez votre compte créé dans Supabase Authentication.</p>
      </div>

      <div class="form-group">
        <label for="loginEmail">Adresse email</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="hypolite.reoutar@unwomen.org"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="loginPassword">Mot de passe</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
        />
      </div>

      <div class="login-actions">
        <button id="loginBtn" type="button">Connexion</button>
      </div>

      <div id="loginMessage" style="margin-top:14px;"></div>

      <div class="empty" style="margin-top:18px;">
        Après connexion, l’application vérifie votre profil dans
        <strong>profiles</strong>, puis vous redirige vers le dashboard.
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>
</body>
</html>
