<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ONU Femmes — Réinitialisation mot de passe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header auth-header">
    <div class="header-inner container">
      <div class="brand-block">
        <img src="assets/img/logunw.jpg" alt="ONU Femmes" class="logo" />
        <div class="brand-text">
          <span class="eyebrow">TaskFlow Management Portal</span>
          <h1>ONU Femmes RDC</h1>
          <p>Réinitialiser le mot de passe</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container login-page">
    <section class="login-card auth-card">
      <div class="login-card-header">
        <span class="section-kicker">Sécurité</span>
        <h2 class="section-title">Réinitialisation du mot de passe</h2>
        <p class="section-subtitle">
          Saisissez votre nouveau mot de passe pour sécuriser de nouveau votre compte.
        </p>
      </div>

      <div id="resetPasswordMessage" class="form-message" aria-live="polite"></div>

      <div class="form-group">
        <label for="resetNewPassword">Nouveau mot de passe</label>
        <input id="resetNewPassword" type="password" />
      </div>

      <div class="form-group">
        <label for="resetConfirmPassword">Confirmer le nouveau mot de passe</label>
        <input id="resetConfirmPassword" type="password" />
      </div>

      <div class="login-actions">
        <button id="resetPasswordBtn" class="btn btn-primary btn-block" type="button">
          Mettre à jour le mot de passe
        </button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth-utils.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
