<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ONU Femmes — Réinitialisation mot de passe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="assets/img/logunw.jpg" alt="ONU Femmes" class="logo" />
        <div>
          <h1>ONU Femmes Task Manager</h1>
          <p>Réinitialiser le mot de passe</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container login-page">
    <section class="login-card">
      <div id="resetPasswordMessage"></div>

      <div class="form-group">
        <label for="resetNewPassword">Nouveau mot de passe</label>
        <input id="resetNewPassword" type="password" />
      </div>

      <div class="form-group">
        <label for="resetConfirmPassword">Confirmer le nouveau mot de passe</label>
        <input id="resetConfirmPassword" type="password" />
      </div>

      <div class="login-actions">
        <button id="resetPasswordBtn" type="button">Mettre à jour le mot de passe</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
