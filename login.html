<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONU Femmes — Connexion</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="login">

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="assets/img/logunw.jpg" alt="ONU Femmes" class="logo" />
        <div>
          <h1>ONU Femmes TaskFlow</h1>
          <p>Connexion sécurisée</p>
        </div>
      </div>
    </div>
  </header>

  <!-- LOGIN -->
  <main class="login-page">

    <div class="login-card">

      <div class="login-card-header">
        <h2 class="section-title">Connexion</h2>
        <p class="muted">
          Accédez à votre espace de gestion des tâches
        </p>
      </div>

      <!-- MESSAGE -->
      <div id="loginMessage"></div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="prenom.nom@unwomen.org"
          required
        />
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="********"
          required
        />
      </div>

      <!-- ACTION -->
      <div class="login-actions">
        <button id="loginBtn">Connexion</button>
      </div>

      <!-- INFO -->
      <div class="info-box" style="margin-top:15px;">
        Utilisez votre compte Supabase (email + mot de passe).
      </div>

    </div>

  </main>

  <!-- SCRIPTS (ORDRE CRITIQUE) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="login.js"></script>
</body>
</html>
