<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONU Femmes — Initialiser l’application</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="init">
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="assets/img/logunw.jpg" alt="ONU Femmes" class="logo" />
        <div>
          <h1>ONU Femmes Task Manager</h1>
          <p>Initialisation du système</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title">Initialiser l’application</h2>

    <section class="card" style="max-width: 980px;">
      <h3 style="margin-top:0;">Créer la base fonctionnelle</h3>

      <div class="modal-row">
        <div>
          <label for="initPillarName">Nom court du pilier</label>
          <input id="initPillarName" type="text" placeholder="Ex. WPS" />
        </div>

        <div>
          <label for="initPillarFullName">Intitulé complet</label>
          <input id="initPillarFullName" type="text" placeholder="Ex. Women Peace and Security" />
        </div>
      </div>

      <div class="modal-row">
        <div>
          <label for="initSupervisorName">Nom superviseur</label>
          <input id="initSupervisorName" type="text" placeholder="Ex. Sylvie Gougoua" />
        </div>

        <div>
          <label for="initSupervisorEmail">Email superviseur</label>
          <input id="initSupervisorEmail" type="email" placeholder="nom@unwomen.org" />
        </div>
      </div>

      <div class="modal-row">
        <div>
          <label for="initSupervisorRole">Fonction</label>
          <input id="initSupervisorRole" type="text" placeholder="Ex. Programme Specialist WPS & HA" />
        </div>

        <div>
          <label for="initSupervisorOffice">Bureau</label>
          <input id="initSupervisorOffice" type="text" placeholder="Ex. ONU Femmes RDC" />
        </div>
      </div>

      <div class="modal-actions" style="justify-content:flex-start;">
        <button id="initializeAppBtn" type="button">Initialiser</button>
        <button id="resetAppBtn" class="secondary" type="button">Réinitialiser</button>
      </div>

      <div id="initMessage" style="margin-top:12px;"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
