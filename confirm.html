<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmation réussie — TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <div class="header-inner container">
      <div class="brand-block">
        <img src="assets/img/logunw.jpg" alt="Logo ONU Femmes" class="logo" />
        <div class="brand-text">
          <span class="eyebrow">TaskFlow Management Portal</span>
          <h1>ONU Femmes RDC</h1>
          <p>Confirmation de compte</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container login-page">
    <section class="login-card auth-card redirect-card" aria-labelledby="confirmTitle">
      <div class="redirect-icon" aria-hidden="true">✓</div>

      <div class="login-card-header">
        <span class="section-kicker">Confirmation réussie</span>
        <h2 id="confirmTitle" class="section-title">Votre email a été bien confirmé</h2>
        <p class="section-subtitle">
          Vous pouvez maintenant accéder à l'application TaskFlow.
        </p>
      </div>

      <div id="confirmMessage" class="success-box">
        Votre adresse email a bien été confirmée.
      </div>

      <div class="card-actions" style="justify-content:center; margin-top:20px;">
        <a href="./login.html" class="btn btn-primary" style="text-decoration:none;">
          Accéder à l’application TaskFlow
        </a>
      </div>
    </section>
  </main>
</body>
</html>
