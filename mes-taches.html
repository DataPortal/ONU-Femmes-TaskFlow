<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONU Femmes — Mes tâches</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="my-tasks">
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="assets/img/logunw.jpg" alt="ONU Femmes" class="logo" />
        <div>
          <h1>ONU Femmes - RDC Task Management Portal</h1>
          <p>Suivi individuel des tâches</p>
        </div>
      </div>

      <div class="top-tools no-print">
        <select id="currentUserSelect"></select>
        <div id="currentUserLabel"></div>
      </div>
    </div>
  </header>

  <nav class="no-print">
    <a href="index.html">Dashboard</a>
    <a href="mes-taches.html" class="active">Mes tâches</a>
    <a href="mon-equipe.html">Mon équipe</a>
    <a href="inscription.html">Inscription</a>
  </nav>

  <main class="container">
    <h2 id="myTasksTitle" class="section-title">Mes tâches</h2>

    <section id="myTasksKpis" class="dashboard"></section>

    <section class="filters no-print">
      <input
        type="text"
        id="myTasksSearchInput"
        placeholder="Rechercher dans mes tâches"
      />
      <button id="myTasksSearchBtn" type="button">Rechercher</button>
    </section>

    <section class="table-wrap">
      <table id="myTasksTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tâche</th>
            <th>Assigné à</th>
            <th>Superviseur</th>
            <th>Priorité</th>
            <th>Statut</th>
            <th>Progression staff</th>
            <th>Commentaire staff</th>
            <th>Évaluation superviseur</th>
            <th>Commentaire superviseur</th>
            <th>Échéance</th>
            <th class="no-print">Action</th>
          </tr>
        </thead>
        <tbody id="myTasksTbody"></tbody>
      </table>
    </section>
  </main>

  <div id="taskModal" class="modal no-print">
    <div class="modal-content">
      <h3>Mise à jour de la tâche</h3>
      <input type="hidden" id="editTaskId" />

      <div class="modal-row">
        <div>
          <label for="editStatus">Statut</label>
          <select id="editStatus">
            <option>Non commencée</option>
            <option>En cours</option>
            <option>Bloquée</option>
            <option>Terminée</option>
          </select>
        </div>

        <div>
          <label for="editProgressScore">Score staff (0 à 10)</label>
          <select id="editProgressScore">
            <option value="0">0 = 0%</option>
            <option value="1">1 = 10%</option>
            <option value="2">2 = 20%</option>
            <option value="3">3 = 30%</option>
            <option value="4">4 = 40%</option>
            <option value="5">5 = 50%</option>
            <option value="6">6 = 60%</option>
            <option value="7">7 = 70%</option>
            <option value="8">8 = 80%</option>
            <option value="9">9 = 90%</option>
            <option value="10">10 = 100%</option>
          </select>
        </div>
      </div>

      <div>
        <label for="editStaffComment">Commentaire du staff</label>
        <textarea id="editStaffComment" placeholder="Ajouter une nouvelle mise à jour..."></textarea>
      </div>

      <div class="modal-row">
        <div>
          <label for="editSupervisorScore">Score superviseur (0 à 10)</label>
          <select id="editSupervisorScore">
            <option value="0">0 = 0%</option>
            <option value="1">1 = 10%</option>
            <option value="2">2 = 20%</option>
            <option value="3">3 = 30%</option>
            <option value="4">4 = 40%</option>
            <option value="5">5 = 50%</option>
            <option value="6">6 = 60%</option>
            <option value="7">7 = 70%</option>
            <option value="8">8 = 80%</option>
            <option value="9">9 = 90%</option>
            <option value="10">10 = 100%</option>
          </select>
        </div>

        <div>
          <label for="editSupervisorStatus">Appréciation superviseur</label>
          <select id="editSupervisorStatus">
            <option>Non évalué</option>
            <option>Très satisfaisant</option>
            <option>Acceptable</option>
            <option>À améliorer</option>
            <option>Critique</option>
          </select>
        </div>
      </div>

      <div>
        <label for="editSupervisorComment">Commentaire du superviseur</label>
        <textarea id="editSupervisorComment" placeholder="Ajouter un nouveau commentaire de supervision..."></textarea>
      </div>

      <div class="modal-actions">
        <button id="closeTaskModalBtn" class="secondary" type="button">Fermer</button>
        <button id="saveTaskBtn" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
